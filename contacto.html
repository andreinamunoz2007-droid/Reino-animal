<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="imagenes/logo_animales.jpg">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/estilo.css">
    <title>Contacto - Reino Animal</title>
</head>
<body>
  
    <header class="header-glass">
        <nav class="navbar-glass">
            <a href="index.html" class="logo">Reino<span>Animal</span></a>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="vertebrados.html">Vertebrados</a></li>
                <li><a href="invertebrados.html">Invertebrados</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="tarjeta-formulario">
          <br><br><br><br><h2>Formulario de Registro / Consulta Académica</h2>
            <br><br>
            <form action="#" method="POST">
                
                <div class="controlador">
                   <p><b>GENERO</b></p>

<input type="radio" id="m" name="genero" value="mascul ino">

<label for="m">Masculino</label>

<input type="radio" id="f" name="genero" value="femenino">

<label for="f">Femenino</label><br><br>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required 
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,50}" 
                           title="El nombre solo debe contener letras y un mínimo de 3 caracteres."><br><br>
                           <label for="fecha"><b>FECHA NACIMIENTO</b></label>
    <input type="date"
    id="fecha-nac"
    name="fecha-nac"
   required placeholder="00-00-00"
    min="1900-04-29"
    max="2026-04-29"><br><br>
                </div>
                 <label for="edad"><b>EDAD</b></label><input
    type="nunber" 
    id="edad" 
    name="edad"
    min=1 
    max=100 
    required><br><br>

                <div class="controlador">
                    <label for="telefono">Teléfono de Contacto (Ej: 0414-1234567):</label>
                    <input type="tel" id="telefono" name="telefono" required 
                           pattern="[0-9]{4}-[0-9]{7}" 
                           title="Formato requerido: 4 números, un guion y 7 números (Ej: 0414-1234567)."><br><br>
                </div>
                 <label for="correo electrónico"><b>CORREO</b></label>
    <input 
    type="email"
    id="correo"
    name="correo"
    placeholder="ej: correo2007@gmail.com"
    min=15
    max=25
    required><br><br>

                <div class="controlador">
                    <label for="categoria">Categoría que deseas investigar:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">-- Elige una categoría --</option>
                        <option value="vert">Animales Vertebrados</option>
                        <option value="invert">Animales Invertebrados</option>
                        <option value="ambos">Ambos Grupos</option>
                    </select><br><br>
                </div>

                <div class="controlador">
                    <label for="mensaje">Detalla tu consulta o mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe aquí tus comentarios..."></textarea><br><br>
                </div>

                <div class="controlador-checkbox">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos de validación de este sitio educativo.</label><br><br>
                </div>

                <button type="submit" class="btn-enviar">Enviar Registro</button>
            </form>
        </section>
    </main>

    <footer class="footer-flex">
        <p>&copy; 2026 - Página Educativa de Animales Vertebrados e Invertebrados</p>
    </footer>

</body>
</html>
